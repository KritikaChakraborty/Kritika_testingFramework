<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Execution Results</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>

    <style>
        body {
            background-color: #f5f7fa;
        }

        .card {
            border-radius: 0.75rem;
        }

        .status-PASS {
            background-color: #198754;
            color: white;
            font-weight: 500;
            padding: 0.25rem 0.5rem;
            border-radius: 0.5rem;
        }

        .status-FAIL {
            background-color: #dc3545;
            color: white;
            font-weight: 500;
            padding: 0.25rem 0.5rem;
            border-radius: 0.5rem;
        }

        .status-SKIPPED {
            background-color: #ffc107;
            color: black;
            font-weight: 500;
            padding: 0.25rem 0.5rem;
            border-radius: 0.5rem;
        }

        table tbody tr:hover {
            background-color: #e9ecef;
        }
    </style>
</head>

<body>

<div class="container mt-5">

    <div class="card shadow-sm">
        <!-- Blue header like dashboard -->
        <div class="card-header bg-primary text-white">
            <h4 class="mb-0">Execution Results</h4>
        </div>

        <div class="card-body">

            <div class="table-responsive">
                <table class="table table-bordered table-striped align-middle">
                    <thead class="table-dark">
                    <tr>
                        <th>Test Case ID</th>
                        <th>Status</th>
                        <th>Execution Time (ms)</th>
                        <th>Executed At</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="r : ${results}">
                        <td th:text="${r.testCaseId}"></td>
                        <td>
                                <span class="badge"
                                      th:text="${r.status}"
                                      th:classappend="' status-' + ${r.status}">
                                </span>
                        </td>
                        <td th:text="${r.executionTime}"></td>
                        <td th:text="${r.executedAt}"></td>
                    </tr>
                    </tbody>
                </table>
            </div>

            <div class="text-end mt-3">
                <a th:href="@{/ui/dashboard}" class="btn btn-outline-primary">&larr; Back to Dashboard</a>
            </div>

        </div>
    </div>

</div>

</body>
</html>
