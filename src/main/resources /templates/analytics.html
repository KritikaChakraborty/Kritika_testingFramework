<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Analytics</title>

    <!-- Bootstrap CSS -->
    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
            rel="stylesheet"
    />
</head>

<body style="background-color: #f5f7fa;">

<div class="container mt-5">

    <div class="card shadow-sm">
        <!-- BLUE header like other pages -->
        <div class="card-header bg-primary text-white">
            <h5 class="mb-0">Failure Trends</h5>
        </div>

        <div class="card-body">

            <div class="table-responsive">
                <table class="table table-bordered table-striped align-middle">
                    <thead class="table-dark">
                    <tr>
                        <th>Date</th>
                        <th>Failure Count</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="t : ${trends}">
                        <td th:text="${t.date}"></td>
                        <td th:text="${t.failures}"></td>
                    </tr>
                    </tbody>
                </table>
            </div>

            <!-- CSV Export & Back buttons -->
            <div class="d-flex justify-content-between mt-3">
                <a th:href="@{/ui/dashboard}" class="btn btn-outline-primary">
                    &larr; Back to Dashboard
                </a>
                <a th:href="@{/export/csv}" class="btn btn-success">
                    Export to CSV
                </a>
            </div>

        </div>
    </div>

</div>

</body>
</html>
