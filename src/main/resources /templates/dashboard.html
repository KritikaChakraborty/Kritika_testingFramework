<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Test Platform Dashboard</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>

<body style="background-color: #f5f7fa;">

<div class="container mt-5">

    <div class="card shadow-sm">
        <!-- Blue header like other pages -->
        <div class="card-header bg-primary text-white">
            <h4 class="mb-0">Test Platform Dashboard</h4>
        </div>

        <div class="card-body">

            <!-- Create Test Case Form -->
            <h5>Create Test Case</h5>
            <form th:action="@{/ui/testcase}" method="post" th:object="${testCase}" class="mb-4">
                <div class="mb-2">
                    <label class="form-label">Name:</label>
                    <input type="text" class="form-control" th:field="*{name}"/>
                </div>
                <div class="mb-2">
                    <label class="form-label">Type:</label>
                    <select class="form-select" th:field="*{type}">
                        <option value="UI">UI</option>
                        <option value="API">API</option>
                    </select>
                </div>
                <div class="mb-2">
                    <label class="form-label">Target:</label>
                    <input type="text" class="form-control" th:field="*{target}"/>
                </div>
                <div class="mb-2">
                    <label class="form-label">Method:</label>
                    <input type="text" class="form-control" th:field="*{method}"/>
                </div>
                <button type="submit" class="btn btn-primary mt-2">Create</button>
            </form>

            <hr/>

            <!-- Available Test Cases -->
            <h5>Available Test Cases</h5>
            <form th:action="@{/ui/run}" method="post">
                <div class="mb-2" th:each="tc : ${testCases}">
                    <input type="checkbox" name="testCaseIds" th:value="${tc.id}"/>
                    <span th:text="${tc.name}"></span>
                </div>
                <button type="submit" class="btn btn-success mt-2">Run Selected Tests</button>
            </form>

            <hr/>

            <!-- Navigation Buttons -->
            <div class="mt-3">
                <a th:href="@{/ui/execution}" class="btn btn-outline-primary me-2">&rarr; View Execution</a>
                <a th:href="@{/ui/analytics}" class="btn btn-outline-primary">&rarr; View Analytics</a>
            </div>

        </div>
    </div>

</div>

</body>
</html>
